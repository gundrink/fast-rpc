[package]
name = "tpu-sidecar"
version = "0.1.0"
edition = "2021"
description = "Local HTTP -> Solana TPU-QUIC bridge for fast-rpc (official Agave TLS utils + Anza quinn)"

[dependencies]
quinn = { package = "anza-quinn", version = "=0.11.11-rustsec20260339" }
rustls = { version = "0.23.43", default-features = false, features = ["std"] }
solana-tls-utils = { version = "4.3.2", features = ["agave-unstable-api"] }
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
